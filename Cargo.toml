[package]
name = "up-airquality"
version = "0.1.0"
edition = "2021"
description = "Minimal 'fake UniFi Protect console' that adopts a UP-AirQuality sensor over its UCP4/WSS protocol and prints its readings. Reverse-engineered; not affiliated with Ubiquiti."
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/ToasteezStudio/up-airquality"
homepage = "https://github.com/ToasteezStudio/up-airquality"

[dependencies]
tokio = { version = "1.43.0", features = ["full"] }
futures-util = "0.3.31"
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.24.0", features = ["handshake"] }
tungstenite = "0.24.0"
tokio-rustls = "0.26.1"
rustls = "0.23.21"
rustls-native-certs = "0.8.5"
rcgen = "0.13.2"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.137"
clap = { version = "4.5.26", features = ["derive"] }
anyhow = "1.0.95"
flate2 = "1.0.35"
uuid = { version = "1.12.0", features = ["v4"] }
sha2 = "0.10.8"
tokio-postgres = "0.7.12"
tokio-postgres-rustls = "0.14.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
